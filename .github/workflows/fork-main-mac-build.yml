name: Fork main macOS Build

# Why: a fork has none of the upstream signing/notary secrets, so the hourly and
# adhoc builds skip it. This packages an arm64 build from every push to the fork's
# main and publishes it as a `v<version>` release on the fork itself, with the
# `latest-mac.yml` + zip the in-app updater installs from. The app is built with
# ORCA_RELEASE_REPO=<this repo>, so its updater follows these releases, not upstream.
#
# Each build is one patch above the larger of package.json and the newest tag already on
# this repo (config/scripts/fork-release-version.mjs), so versions only ever go up and an
# upstream merge that raises package.json is followed. Bump package.json to move major/minor.
#
# Signing uses a self-signed certificate from repo secrets so every build shares one
# designated requirement — Squirrel.Mac refuses updates from ad-hoc builds. Create it
# once and store it as secrets:
#   ORCA_FORK_MAC_CERT_P12       base64 of a .p12 holding a codeSigning cert + key
#   ORCA_FORK_MAC_CERT_PASSWORD  that .p12's password
#
# The cert is not Apple-issued, so Gatekeeper blocks the first manual install; clear it
# once with
#   xattr -dr com.apple.quarantine /Applications/Orca.app
# Updates installed by the app afterwards are not quarantined.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only the newest main is worth a package; a superseded build is wasted runner time.
  group: fork-main-mac-build
  cancel-in-progress: true

env:
  # Tags from earlier fork build formats; pruned alongside the current v<major>.<minor>.<patch>.
  TAG_PREFIX: main-build-
  KEEP_RELEASES: 10

jobs:
  build:
    # Upstream already has signed channels for main; this exists for forks only.
    if: github.repository != 'stablyai/orca'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Host CPU only: this packages arm64 on an arm64 runner, so no cross-arch natives.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app
        run: pnpm build:release
        env:
          ORCA_RELEASE_REPO: ${{ github.repository }}

      - name: Compute build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=12 HEAD)"
          version="$(node config/scripts/fork-release-version.mjs origin)"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: signing
        shell: bash
        env:
          CERT_P12: ${{ secrets.ORCA_FORK_MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.ORCA_FORK_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12" ]]; then
            echo "::error::ORCA_FORK_MAC_CERT_P12 is not set; ad-hoc builds cannot auto-update (see the header of this workflow)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/fork-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode >"$RUNNER_TEMP/fork-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/fork-signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$RUNNER_TEMP/fork-signing.p12"
          # Why: codesign resolves identities through the search list even when given --keychain.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Untrusted self-signed identities only appear without -v.
          identity="$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::No code-signing identity found in ORCA_FORK_MAC_CERT_P12."
            exit 1
          fi
          echo "identity=$identity" >>"$GITHUB_OUTPUT"

      # Why identity '-' plus the sign hook: electron-builder only signs with identities macOS
      # trusts; '-' gets past that lookup and the hook signs with the self-signed cert instead.
      - name: Package and publish
        run: >-
          node config/scripts/ensure-native-runtime.mjs --runtime=electron &&
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dmg zip --arm64
          --publish always
          -c.mac.identity=-
          -c.mac.sign=config/scripts/fork-mac-sign.cjs
          -c.publish.owner="${GITHUB_REPOSITORY_OWNER}"
          -c.publish.repo="${GITHUB_REPOSITORY#*/}"
          -c.publish.releaseType=release
          -c.releaseInfo.releaseName="v${ORCA_LOCAL_BUILD_VERSION}"
          -c.releaseInfo.releaseNotes="Arm64 macOS build of main at ${GITHUB_SHA}."
        env:
          GH_TOKEN: ${{ github.token }}
          ORCA_BUILD_COMMIT: ${{ steps.identity.outputs.commit }}
          ORCA_LOCAL_BUILD_VERSION: ${{ steps.identity.outputs.version }}
          ORCA_FORK_MAC_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prune old builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select((.tagName | startswith(\"$TAG_PREFIX\")) or (.tagName | contains(\"-local.\")) or (.tagName | test(\"^v[0-9]+[.][0-9]+[.][0-9]+$\")))] | sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag ||
                echo "::warning::Could not delete $tag"
            done
